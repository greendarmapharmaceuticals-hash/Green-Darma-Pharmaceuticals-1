<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
    <g transform="translate(250, 220)">
        <!-- Top Light Green Diamond -->
        <polygon points="0,-120 40,-80 0,-40 -40,-80" fill="#84cc16" />

        <!-- Inner Left Dark Green Arm -->
        <polygon points="0,-25 -75,-100 -125,-50 0,75 55,20" fill="#2c8562" />

        <!-- Inner Right Dark Green Arm -->
        <polygon points="0,-25 75,-100 125,-50 0,75 -55,20" fill="#1b4d3e" />

        <!-- Outer Left Parallel Chevron Wing -->
        <polygon points="-70,30 -145,-45 -195,0 -70,125 -15,70" fill="#2c8562" />

        <!-- Outer Right Parallel Chevron Wing -->
        <polygon points="70,30 145,-45 195,0 70,125 15,70" fill="#1b4d3e" />
    </g>

    <!-- Brand Typography -->
    <text x="250" y="440" font-family="'Poppins', 'Inter', sans-serif" font-weight="700" font-size="34" fill="#84cc16" letter-spacing="4" text-anchor="middle">GREEN DARMA</text>
</svg>
